substitutions:
  # Changing the node name renames every entity ID in Home Assistant.
  # Check what points at the old IDs before touching this.
  name: w48-phone
  friendly_name: W48 Phone

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  # The speaker media player used below requires 2026.4.0 or newer.
  min_version: 2026.4.0
  platformio_options:
    board_build.flash_mode: dio
  project:
    name: gpsm2.tischfernsprecher-w48
    version: '1.1.6'

esp32:
  board: esp32-s3-devkitc-1
  framework:
    # ESP-IDF is the default since ESPHome 2026.1.0 and is what the speaker
    # media player expects. Do not switch back to arduino.
    type: esp-idf

# No psram: block on purpose. The board is sold as an N16R8, which would mean
# 8 MB of octal PSRAM, but this one reports none: with mode octal the second
# stage bootloader hangs before it prints anything, and with mode quad the
# device boots and logs "PSRAM: Available: NO". Everything below is therefore
# sized for internal RAM only.

logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

# Allow Over-The-Air updates
ota:
  - platform: esphome
    # The running firmware is what checks this password, not the one being
    # uploaded. Changing the value means the next OTA is rejected and the
    # device has to be flashed over USB once.
    password: !secret ota_esphome_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fallback access point. If the configured network is unreachable, the device
  # opens its own and serves the captive portal below, so it can be recovered
  # without opening the housing.
  ap:

captive_portal:

# Microphone and amplifier share one I2S bus, because they share the BCLK and
# LRCLK wires in the hardware. ESPHome serialises access with a mutex, so only
# one of them can hold the bus at a time - recording and playback alternate.
# That is why the voice assistant must not be left running while the handset is
# down: a microphone that never lets go means the speaker never gets the bus.
i2s_audio:
  - id: i2s_in
    i2s_lrclk_pin: GPIO17 #WS Pin from the INMP441 Microphone
    i2s_bclk_pin: GPIO16 #SCK Pin from the INMP441 Microphone

microphone:
  - platform: i2s_audio
    adc_type: external
    pdm: false
    id: mic_i2s
    channel: left
    bits_per_sample: 32bit
    i2s_audio_id: i2s_in
    i2s_din_pin: GPIO13  #SD Pin from the INMP441 Microphone

speaker:
  - platform: i2s_audio
    id: i2s_speaker_out
    i2s_audio_id: i2s_in
    dac_type: external
    i2s_dout_pin: GPIO09   #  DIN Pin of the MAX98357A Audio Amplifier
    channel: mono
    # 16 kHz is what Home Assistant's text to speech delivers, and a W48
    # handset earpiece is bandwidth limited far below that anyway. Running the
    # whole chain at 16 kHz mono keeps the buffers small, which matters because
    # there is no PSRAM.
    sample_rate: 16000
    bits_per_sample: 16bit
  # The announcement and media pipelines are not allowed to share one speaker,
  # so the mixer splits the single physical amplifier into two virtual ones.
  - platform: mixer
    id: speaker_mixer
    output_speaker: i2s_speaker_out
    source_speakers:
      - id: announcement_speaker
      - id: media_speaker

media_player:
  - platform: speaker
    name: "Speaker"
    id: media_player_speaker
    # Default is 1 MB, which lives in PSRAM on boards that have it. This one
    # does not, so the allocation has to fit in internal RAM.
    buffer_size: 64000
    announcement_pipeline:
      speaker: announcement_speaker
      format: FLAC
      sample_rate: 16000
      num_channels: 1
    media_pipeline:
      speaker: media_speaker
      format: FLAC
      sample_rate: 16000
      num_channels: 1

voice_assistant:
  microphone: mic_i2s
  id: va
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 10.0
  use_wake_word: false
  media_player: media_player_speaker
  on_listening: #Switches the green LED on and red off when listening
    - switch.turn_on:
        id: status_led_green
    - switch.turn_off:
        id: status_led_red
  on_end:
    - switch.turn_off:
        id: status_led_green
    - switch.turn_on:
        id: status_led_red
    # Only keep listening while the handset is actually off the cradle.
    # handset is ON when lifted, so this must be is_on - with the inverted pin
    # logic this repository used before, the same condition was true while the
    # handset was resting and restarted the assistant in an endless loop.
    - if:
        condition:
          binary_sensor.is_on: handset
        then:
          - voice_assistant.start_continuous


binary_sensor:
  - platform: gpio
    pin:
      number: GPIO40 # switch from the handset
      mode:
        input: True
        # The switch connects GPIO40 to 3V3, not to GND - see pin 1 in the
        # Fritzing schematic. It can therefore only ever drive the pin high,
        # and without the internal pull-down the pin floats whenever the switch
        # is open. A pull-up here would hold the pin high permanently and the
        # sensor would never change state at all.
        pulldown: True
    # Handset resting -> switch open   -> pull-down -> low  -> off -> "closed"
    # Handset lifted  -> switch closed -> 3V3       -> high -> on  -> "open"
    name: Handset
    id: handset
    device_class: opening
    filters:
      - delayed_off: 0.3s
    # Lifting the handset starts the assistant.
    on_press:
      then:
        - voice_assistant.start_continuous
        - switch.turn_on: status_led_red
    # Putting it back stops the assistant and silences the speaker.
    on_release:
      then:
        - voice_assistant.stop
        - media_player.stop:
        - switch.turn_off: status_led_red

switch:
  - platform: gpio # LED green
    name: Status LED Green
    id: status_led_green
    pin: GPIO42
    inverted: True

  - platform: gpio # LED red
    name: Status LED Red
    id: status_led_red
    pin: GPIO41
    inverted: True
